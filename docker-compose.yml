# Инфраструктура для локальной разработки: база, хранилище файлов, Kafka.
# Запуск: docker compose up -d
# Значения по умолчанию заданы прямо тут, .env нужен, только если хочешь их поменять.

name: photo-analysis

services:
  # ---------- PostgreSQL: фото, статусы, результаты ----------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photo}
      POSTGRES_DB: ${POSTGRES_DB:-photo}
    ports:
      - "5433:5432"   # 5433 снаружи: 5432 на ноутбуке занят Postgres, установленным в Windows
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Таблицы создаёт api-service при старте (миграции из папки migrations).
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photo} -d ${POSTGRES_DB:-photo}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- SeaweedFS: сами файлы фотографий (S3-совместимое хранилище) ----------
  # Вместо MinIO: образы MinIO из России не скачиваются, а этот есть на зеркале.
  # Для кода разницы нет, он работает по протоколу S3.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0
      -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API, сюда ходят сервисы
      - "8888:8888"   # просмотр файлов в браузере: http://localhost:8888/buckets/
    volumes:
      - s3data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8333"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Создаёт бакет photos и завершается.
  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sleep 3 &&
        echo "s3.bucket.create -name ${S3_BUCKET:-photos}" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 &&
        echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
    restart: "no"

  # ---------- Kafka: очередь задач на анализ ----------
  # Один узел в режиме KRaft (без ZooKeeper).
  # Два адреса: kafka:19092 — для контейнеров, localhost:9092 — для программ на ноутбуке.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Создаёт топики и завершается.
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic photos.uploaded --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic photos.failed --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"

  # Веб-интерфейс, чтобы смотреть топики и сообщения: http://localhost:8090
  # Не запускается по умолчанию: docker compose --profile ui up -d
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["ui"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    mem_limit: 384m

volumes:
  pgdata:
  s3data:
  kafkadata:
