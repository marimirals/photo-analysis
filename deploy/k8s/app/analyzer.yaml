# analyzer (Python, OpenCV + MediaPipe). Самый тяжёлый по памяти сервис.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer
spec:
  replicas: 1
  selector:
    matchLabels: { app: analyzer }
  template:
    metadata:
      labels: { app: analyzer }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      containers:
        - name: analyzer
          image: photo-analyzer:dev
          imagePullPolicy: Never
          env:
            - name: S3_ENDPOINT
              valueFrom: { configMapKeyRef: { name: app-config, key: S3_ENDPOINT } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: S3_SECRET_KEY } }
            - { name: ANALYZER_WORKERS, value: "2" }
            - { name: METRICS_PORT, value: "9102" }
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: metrics, containerPort: 9102 }
          # Пробы через стандартную gRPC-проверку здоровья (grpc.health.v1).
          # startupProbe даёт до минуты на загрузку моделей: пока она не прошла,
          # остальные пробы не начинаются и под не убивают за медленный старт.
          startupProbe:
            grpc: { port: 50051 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc: { port: 50051 }
            periodSeconds: 5
          livenessProbe:
            grpc: { port: 50051 }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
---
# Headless: worker получает по DNS адреса всех копий (для round_robin),
# Prometheus — тоже, чтобы собирать метрики с каждой.
apiVersion: v1
kind: Service
metadata:
  name: analyzer
spec:
  clusterIP: None
  selector: { app: analyzer }
  ports:
    - { name: grpc, port: 50051, targetPort: grpc }
    - { name: metrics, port: 9102, targetPort: metrics }
