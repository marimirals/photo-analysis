# Kafka в режиме KRaft, один узел — как в docker-compose, только адрес
# для клиентов один: kafka:9092 (все клиенты внутри кластера).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      # Важно: иначе Kubernetes добавит переменные KAFKA_PORT, KAFKA_SERVICE_HOST…
      # (по имени сервиса kafka), а образ Kafka превращает все KAFKA_* в настройки.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data/logs" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx512m" }
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          readinessProbe:
            tcpSocket: { port: kafka }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 640Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: { app: kafka }
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
---
# Создаёт топики и завершается. Пока Kafka не готова, падает и перезапускается
# (restartPolicy: OnFailure) — так и задумано.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 30
  template:
    metadata:
      labels: { app: kafka-topics }
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:4.1.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              B=kafka:9092
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server $B --create --if-not-exists --topic photos.uploaded --partitions 3 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server $B --create --if-not-exists --topic photos.failed --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server $B --list
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
